[project]
name = "lota"
version = "0.2.0"
description = "LLM-powered Dota 2 analysis tool"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
keywords = ["dota2", "llm", "langchain", "langgraph", "analysis"]
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.5.0",
    "pillow>=9.0.0",
]

[project.scripts]
lota = "lota.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lota"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
